<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Tip</title>

  <style>
    .relative {
      position: relative;
    }

    .flex {
      display: flex;
    }

    .justify-center {
      justify-content: center;
    }

    .items-center {
      align-items: center;
    }

    .group {
      display: flex;
      justify-content: center;
    }

    .transition-all {
      transition-property: all;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 150ms;
    }

    .rounded-full {
      border-radius: 9999px;
    }

    .bg-gray-200 {
      background-color: rgb(229 231 235);
    }

    .p-1 {
      padding: 0.25rem;
    }

    .w-4 {
      width: 1rem;
    }

    .h-4 {
      height: 1rem;
    }

    .absolute {
      position: absolute;
    }

    .opacity-0 {
      opacity: 0;
    }

    .group:hover .group-hover\:opacity-100 {
      opacity: 1;
    }

    .group:hover .group-hover\:-translate-y-7 {
      transform: translateY(-1.75rem);
    }

    .duration-700 {
      transition-duration: 700ms;
    }

    .text-sm {
      font-size: 0.875rem;
      line-height: 1.25rem;
    }

    /* Demo page layout only */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
    }

    section {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .group {
      cursor: pointer;
    }

    svg {
      display: block;
      fill: currentColor;
    }
  </style>
</head>

<body>

  <section class="relative flex justify-center items-center">
    <div class="group flex justify-center transition-all rounded-full bg-gray-200 p-1">
      <svg viewBox="0 0 320 512" class="w-4 h-4">
        <path d="M80 160c0-35.3 28.7-64 64-64h32c35.3 0 64 28.7 64 64v3.6c0 21.8-11.1 42.1-29.4 53.8l-42.2 27.1c-25.2 16.2-40.4 44.1-40.4 74V320c0 17.7 14.3 32 32 32s32-14.3 32-32v-1.4c0-8.2 4.2-15.8 11-20.2l42.2-27.1c36.6-23.6 58.8-64.1 58.8-107.7V160c0-70.7-57.3-128-128-128H144C73.3 32 16 89.3 16 160c0 17.7 14.3 32 32 32s32-14.3 32-32zm80 320a40 40 0 1 0 0-80 40 40 0 1 0 0 80z" />
      </svg>
      <span class="absolute opacity-0 group-hover:opacity-100 group-hover:-translate-y-7 duration-700 text-sm">Information</span>
    </div>
  </section>

</body>
</html>
