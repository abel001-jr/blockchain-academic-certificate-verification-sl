<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credence Dashboard Loading</title>

  <style>
    :root {
      --navy: #152c42;
      --navy-light: #203b55;
      --cream: #f7f6f1;
      --white: #ffffff;
      --gold: #c49a3a;
      --gold-soft: #ead9aa;
      --text: #23384d;
      --muted: #8190a0;
      --skeleton: #e8ebee;
      --skeleton-dark: #dde2e7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      background: var(--cream);
      color: var(--text);
      overflow: hidden;
    }

    /* Dashboard shell */
    .dashboard {
      display: grid;
      grid-template-columns: 245px 1fr;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      background: var(--navy);
      padding: 28px 20px;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px 35px;
    }

    .brand-mark {
      width: 30px;
      height: 34px;
      border: 1px solid var(--gold);
      border-radius: 5px 5px 8px 8px;
      position: relative;
      opacity: .8;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      left: 7px;
      right: 7px;
      top: 10px;
      height: 8px;
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
    }

    .brand-name {
      color: var(--white);
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -.4px;
    }

    .nav-item {
      height: 44px;
      border-radius: 8px;
      margin: 8px 0;
      background: rgba(255, 255, 255, .07);
      position: relative;
      overflow: hidden;
    }

    .nav-item::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 15px;
      width: 105px;
      height: 13px;
      border-radius: 4px;
      background: rgba(255, 255, 255, .15);
    }

    .nav-item.active {
      background: rgba(196, 154, 58, .13);
      border-left: 3px solid var(--gold);
    }

    .sidebar-bottom {
      position: absolute;
      left: 32px;
      right: 32px;
      bottom: 28px;
    }

    .profile-line {
      height: 11px;
      width: 120px;
      border-radius: 5px;
      background: rgba(255, 255, 255, .13);
      margin-bottom: 10px;
    }

    .profile-line.short {
      width: 82px;
    }

    /* Main content */
    .main {
      padding: 30px 42px;
      position: relative;
    }

    .topbar {
      height: 55px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 26px;
    }

    .title-block {
      width: 245px;
    }

    .skeleton {
      background: linear-gradient(
        90deg,
        var(--skeleton) 25%,
        var(--skeleton-dark) 50%,
        var(--skeleton) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }

    .title {
      height: 25px;
      width: 185px;
      border-radius: 6px;
      margin-bottom: 9px;
    }

    .subtitle {
      height: 12px;
      width: 235px;
      border-radius: 5px;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
    }

    .user-name {
      height: 12px;
      width: 85px;
      border-radius: 5px;
    }

    /* Stat cards */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 24px;
    }

    .stat-card {
      height: 125px;
      background: var(--white);
      border: 1px solid #e7e7e2;
      border-radius: 12px;
      padding: 21px;
    }

    .stat-icon {
      width: 35px;
      height: 35px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .stat-value {
      height: 20px;
      width: 75px;
      border-radius: 5px;
      margin-bottom: 8px;
    }

    .stat-label {
      height: 10px;
      width: 105px;
      border-radius: 4px;
    }

    /* Main panels */
    .content-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 22px;
    }

    .panel {
      background: var(--white);
      border: 1px solid #e7e7e2;
      border-radius: 12px;
      padding: 23px;
    }

    .panel.large {
      height: 335px;
    }

    .panel.small {
      height: 335px;
    }

    .panel-heading {
      height: 17px;
      width: 150px;
      border-radius: 5px;
      margin-bottom: 25px;
    }

    .chart {
      height: 220px;
      display: flex;
      align-items: flex-end;
      gap: 13px;
      padding: 10px 8px 0;
      border-bottom: 1px solid #ecece8;
    }

    .bar {
      flex: 1;
      min-width: 14px;
      border-radius: 5px 5px 0 0;
    }

    .bar:nth-child(1) { height: 38%; }
    .bar:nth-child(2) { height: 55%; }
    .bar:nth-child(3) { height: 45%; }
    .bar:nth-child(4) { height: 70%; }
    .bar:nth-child(5) { height: 52%; }
    .bar:nth-child(6) { height: 82%; }
    .bar:nth-child(7) { height: 63%; }
    .bar:nth-child(8) { height: 91%; }

    .activity {
      display: flex;
      flex-direction: column;
      gap: 17px;
    }

    .activity-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .activity-dot {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .activity-text {
      flex: 1;
    }

    .activity-main {
      height: 11px;
      width: 78%;
      border-radius: 4px;
      margin-bottom: 7px;
    }

    .activity-sub {
      height: 8px;
      width: 52%;
      border-radius: 4px;
    }

    /* Central loading indicator */
    .loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(247, 246, 241, .66);
      backdrop-filter: blur(2px);
      z-index: 20;
    }

    .loading-card {
      width: 245px;
      padding: 28px 25px 24px;
      text-align: center;
      background: rgba(255, 255, 255, .94);
      border: 1px solid #e4e1d7;
      border-radius: 14px;
      box-shadow: 0 16px 45px rgba(21, 44, 66, .12);
    }

    .loader {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      position: relative;
    }

    .loader-ring {
      position: absolute;
      inset: 5px;
      border: 3px solid #e5e1d7;
      border-top-color: var(--gold);
      border-right-color: var(--navy);
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
    }

    .loader-mark {
      position: absolute;
      inset: 21px;
      border: 1px solid var(--gold);
      border-radius: 3px 3px 5px 5px;
    }

    .loading-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 7px;
    }

    .loading-text {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .loading-dots span {
      display: inline-block;
      animation: dots 1.4s infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: .15s; }
    .loading-dots span:nth-child(3) { animation-delay: .3s; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes dots {
      0%, 60%, 100% { transform: translateY(0); opacity: .45; }
      30% { transform: translateY(-3px); opacity: 1; }
    }

    @media (max-width: 900px) {
      .dashboard {
        grid-template-columns: 75px 1fr;
      }

      .brand-name,
      .nav-item::before,
      .sidebar-bottom {
        display: none;
      }

      .brand {
        justify-content: center;
        padding-left: 0;
        padding-right: 0;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .content-grid {
        grid-template-columns: 1fr;
      }

      .main {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="dashboard">

    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-name">Credence</div>
      </div>

      <div class="nav-item active"></div>
      <div class="nav-item"></div>
      <div class="nav-item"></div>
      <div class="nav-item"></div>
      <div class="nav-item"></div>

      <div class="sidebar-bottom">
        <div class="profile-line"></div>
        <div class="profile-line short"></div>
      </div>
    </aside>

    <main class="main">

      <div class="topbar">
        <div class="title-block">
          <div class="skeleton title"></div>
          <div class="skeleton subtitle"></div>
        </div>

        <div class="user">
          <div class="skeleton user-avatar"></div>
          <div class="skeleton user-name"></div>
        </div>
      </div>

      <section class="stats">
        <div class="stat-card">
          <div class="skeleton stat-icon"></div>
          <div class="skeleton stat-value"></div>
          <div class="skeleton stat-label"></div>
        </div>

        <div class="stat-card">
          <div class="skeleton stat-icon"></div>
          <div class="skeleton stat-value"></div>
          <div class="skeleton stat-label"></div>
        </div>

        <div class="stat-card">
          <div class="skeleton stat-icon"></div>
          <div class="skeleton stat-value"></div>
          <div class="skeleton stat-label"></div>
        </div>

        <div class="stat-card">
          <div class="skeleton stat-icon"></div>
          <div class="skeleton stat-value"></div>
          <div class="skeleton stat-label"></div>
        </div>
      </section>

      <section class="content-grid">

        <div class="panel large">
          <div class="skeleton panel-heading"></div>

          <div class="chart">
            <div class="skeleton bar"></div>
            <div class="skeleton bar"></div>
            <div class="skeleton bar"></div>
            <div class="skeleton bar"></div>
            <div class="skeleton bar"></div>
            <div class="skeleton bar"></div>
            <div class="skeleton bar"></div>
            <div class="skeleton bar"></div>
          </div>
        </div>

        <div class="panel small">
          <div class="skeleton panel-heading"></div>

          <div class="activity">
            <div class="activity-row">
              <div class="skeleton activity-dot"></div>
              <div class="activity-text">
                <div class="skeleton activity-main"></div>
                <div class="skeleton activity-sub"></div>
              </div>
            </div>

            <div class="activity-row">
              <div class="skeleton activity-dot"></div>
              <div class="activity-text">
                <div class="skeleton activity-main"></div>
                <div class="skeleton activity-sub"></div>
              </div>
            </div>

            <div class="activity-row">
              <div class="skeleton activity-dot"></div>
              <div class="activity-text">
                <div class="skeleton activity-main"></div>
                <div class="skeleton activity-sub"></div>
              </div>
            </div>

            <div class="activity-row">
              <div class="skeleton activity-dot"></div>
              <div class="activity-text">
                <div class="skeleton activity-main"></div>
                <div class="skeleton activity-sub"></div>
              </div>
            </div>
          </div>
        </div>

      </section>
    </main>
  </div>

  <div class="loading-overlay">
    <div class="loading-card">

      <div class="loader">
        <div class="loader-ring"></div>
        <div class="loader-mark"></div>
      </div>

      <div class="loading-title">Loading Dashboard</div>

      <div class="loading-text">
        Preparing your Credence workspace<span class="loading-dots">
          <span>.</span><span>.</span><span>.</span>
        </span>
      </div>

    </div>
  </div>

</body>
</html>
