<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE | Issue credential card</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:40px 24px;background:#f8f7f2;font:16px/1.6 Arial,sans-serif;color:#152c40}.step{position:relative;width:min(480px,100%)}.number{position:absolute;top:-17px;left:-17px;z-index:5;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:#751c2a;color:#fff;font-weight:700;font-size:20px}.card{--accent:#751c2a;position:relative;overflow:hidden;background:#fff;border:1px solid #e0ddd3;border-radius:20px;box-shadow:0 10px 15px -3px #152c4008;transition:transform .5s cubic-bezier(.16,1,.3,1),box-shadow .5s,border-color .5s}.content{padding:28px;position:relative;z-index:2;display:flex;flex-direction:column;gap:20px}.image{height:100px;border-radius:12px;background:linear-gradient(135deg,#152c40,#284a60);display:grid;place-items:center;position:relative;overflow:hidden;transition:transform .5s,box-shadow .5s}.image:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,#ffffff08 0 2px,transparent 2px 8px);pointer-events:none}.image svg{width:48px;height:48px;color:#e1bd70}.title{font-size:24px;line-height:1.25;font-weight:700;margin:0 0 9px;transition:color .3s,transform .3s}.description{font-size:15px;color:#617180;margin:0;transition:color .3s,transform .3s}.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:4px}.caption{font-size:12px;color:#617180}.action{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:#751c2a;color:white;cursor:pointer;transition:transform .3s,box-shadow .3s}.action svg{width:18px;height:18px}.action:focus-visible{outline:3px solid #152c40;outline-offset:4px}.shine{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(120deg,transparent 40%,#ffffff70 50%,transparent 60%);transform:translateX(-120%);opacity:0}.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,#751c2a18,transparent 70%);opacity:0;transition:opacity .5s;pointer-events:none}.badge{position:absolute;top:12px;right:12px;padding:4px 9px;border-radius:20px;background:#f8f7f2;color:#751c2a;font-size:10px;letter-spacing:1px;z-index:4;opacity:0;transform:scale(.8);transition:opacity .4s,transform .4s}.card:is(:hover,:focus-within,.demo-active){transform:translateY(-8px);border-color:#751c2a40;box-shadow:0 20px 25px -5px #152c4015,0 10px 10px -5px #152c4008}.card:is(:hover,:focus-within,.demo-active) .shine{opacity:1;animation:shine 3s infinite}.card:is(:hover,:focus-within,.demo-active) .glow{opacity:1}.card:is(:hover,:focus-within,.demo-active) .badge{opacity:1;transform:scale(1)}.card:is(:hover,:focus-within,.demo-active) .image{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 15px #152c4015}.card:is(:hover,:focus-within,.demo-active) .title{color:#751c2a;transform:translateX(2px)}.card:is(:hover,:focus-within,.demo-active) .description{color:#425463;transform:translateX(2px)}.card:is(:hover,:focus-within,.demo-active) .action{transform:scale(1.05);box-shadow:0 0 0 4px #751c2a15}.card:is(:hover,:focus-within,.demo-active) .action svg{animation:pulse 1.5s infinite}@keyframes shine{to{transform:translateX(120%)}}@keyframes pulse{50%{transform:scale(1.2)}}.status{font-size:12px;color:#751c2a;margin:18px 0 0;min-height:20px}@media(prefers-reduced-motion:reduce){.card,.image,.title,.description,.badge,.action,.glow{transition:none}.card:is(:hover,:focus-within,.demo-active),.card:is(:hover,:focus-within,.demo-active) .image,.card:is(:hover,:focus-within,.demo-active) .title,.card:is(:hover,:focus-within,.demo-active) .description,.card:is(:hover,:focus-within,.demo-active) .action{transform:none}.card:is(:hover,:focus-within,.demo-active) .shine,.card:is(:hover,:focus-within,.demo-active) .action svg{animation:none}.shine{display:none}}@media(max-width:420px){.content{padding:24px}.title{font-size:21px}.action{width:44px;height:44px;flex-shrink:0}}
</style></head><body><main class="step"><span class="number" aria-label="Step 1">1</span><article class="card"><div class="shine"></div><div class="glow"></div><div class="badge">ISSUANCE</div><div class="content"><div class="image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5M14 2v6h6M14 2l6 6M7 17h2M13 16l6-6 3 3-6 6-4 1z"/></svg></div><div><h1 class="title">Issue credential</h1><p class="description">Universities prepare and approve academic documents, then anchor their hashes on the blockchain.</p></div><div class="footer"><span class="caption">Certificate + transcript</span><button class="action" type="button" aria-label="Start credential issuance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button></div></div></article><p class="status" role="status" id="status"></p></main><script>document.querySelector('.action').onclick=()=>{document.querySelector('.card').classList.add('demo-active');document.getElementById('status').textContent='Design preview: connect this action to the credential issuance workflow.';setTimeout(()=>document.querySelector('.card').classList.remove('demo-active'),3000)};</script></body></html>
