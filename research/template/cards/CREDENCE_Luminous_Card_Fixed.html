<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE | Credential integrity</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:#f8f7f2;color:#f8f7f2;font:14px/1.6 Arial,sans-serif}.wrap{width:min(350px,100%)}.card{position:relative;border-radius:26px;background:radial-gradient(circle at 50% 0%,#28495e,#152c40 65%);border:1px solid #ffffff30;box-shadow:0 14px 30px #152c4025;overflow:hidden;isolation:isolate;transition:box-shadow .45s,border-color .45s}.card:before{content:'';position:absolute;top:18px;left:22px;right:22px;height:1px;background:#ffffff22}.visual{height:230px;position:relative;display:grid;place-items:center;overflow:hidden}.slit{position:absolute;top:153px;left:18%;width:64%;height:5px;border-radius:50%;background:#081b2a;transition:background .45s,box-shadow .45s}.beam{position:absolute;left:12%;width:76%;height:175px;top:-10px;background:linear-gradient(0deg,#f1d19170,transparent 95%);clip-path:polygon(48% 100%,52% 100%,100% 0,0 0);filter:blur(9px);opacity:0;transition:opacity .45s}.halo{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 67%,#f1d19130,transparent 65%);opacity:0;transition:opacity .45s}.icon{position:absolute;top:62px;width:67px;height:67px;color:#91a3ad;transition:color .45s,filter .45s,transform .45s}.on .slit{background:#ffe3a9;box-shadow:0 0 10px #ffe3a9,0 0 30px #f2ce8d}.on .beam,.on .halo{opacity:1}.on .icon{color:#f3d59b;filter:drop-shadow(0 0 12px #f3d59b55);transform:translateY(-3px)}.on{border-color:#ddbe8050;box-shadow:0 14px 30px #152c4025,inset 0 1px #f3d59b60}.content{position:relative;padding:0 26px 26px}small{color:#d1a6ad;letter-spacing:1.3px;font-size:10px}h1{font-size:23px;line-height:1.3;margin:8px 0 12px}p{color:#b8c9d6;font-size:13px;margin:0 0 20px}.controls{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ffffff18;padding:17px 0}.controls span{font-size:12px;color:#c2cfda}.switch{width:64px;height:34px;border:1px solid #ffffff30;background:#0c1e2e;border-radius:18px;padding:4px;cursor:pointer;transition:background .3s}.switch:before{content:'';display:block;width:24px;height:24px;border-radius:50%;background:#cbd6dd;transition:transform .3s,background .3s}.switch[aria-checked=true]{background:#751c2a}.switch[aria-checked=true]:before{transform:translateX(28px);background:#f3d59b}.primary{width:100%;border:1px solid #ffffff25;background:#f8f7f2;color:#152c40;padding:12px;border-radius:9px;font:600 14px Arial,sans-serif;cursor:pointer}.primary:hover{background:#ebe5d7}button:focus-visible,input:focus-visible{outline:3px solid #d4ae56;outline-offset:4px}.verify{margin-top:20px;padding-top:20px;border-top:1px solid #ffffff25}.verify label{display:block;font-size:12px;margin-bottom:7px}.verify input{width:100%;padding:12px;border:1px solid #ffffff25;border-radius:7px;background:#0c1e2e;color:#fff;font:14px Arial,sans-serif}.verify button{margin-top:12px}.note{font-size:11px;color:#c3ccd3;margin:13px 0 0}.result{margin-top:14px;font-size:12px;color:#f1d191;overflow-wrap:anywhere}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{transition:none!important}.on .icon{transform:none}}
</style></head><body><main class="wrap"><article class="card" id="card"><div class="visual" aria-hidden="true"><div class="halo"></div><div class="beam"></div><div class="slit"></div><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6z"/><path d="m8 12 3 3 5-6"/></svg></div><div class="content"><small>CREDENCE · ACADEMIC TRUST</small><h1>Credential integrity</h1><p>Check academic credentials against their institution’s issued records.</p><div class="controls"><span id="light-label">Preview lighting · Off</span><button class="switch" id="light" type="button" role="switch" aria-checked="false" aria-label="Preview card lighting"></button></div><button class="primary" id="open" type="button" aria-expanded="false" aria-controls="verify">Verify a credential →</button><section class="verify" id="verify" hidden><form id="form"><label for="credential">Credential ID</label><input id="credential" required maxlength="150" placeholder="Enter a credential ID" autocomplete="off"><button class="primary" type="submit">Check credential</button></form><p class="note">Interface demo. Enter DEMO-CREDENCE-001 to test a sample match; real verification requires the CREDENCE API.</p><div class="result" id="result" role="status" aria-live="polite"></div></section></div></article></main><script>
const card=document.getElementById('card'),light=document.getElementById('light'),open=document.getElementById('open'),panel=document.getElementById('verify');light.onclick=()=>{const on=light.getAttribute('aria-checked')!=='true';light.setAttribute('aria-checked',String(on));card.classList.toggle('on',on);document.getElementById('light-label').textContent='Preview lighting · '+(on?'On':'Off')};open.onclick=()=>{const expanded=open.getAttribute('aria-expanded')!=='true';open.setAttribute('aria-expanded',String(expanded));panel.hidden=!expanded;open.textContent=expanded?'Close verification ↑':'Verify a credential →';if(expanded)document.getElementById('credential').focus()};document.getElementById('form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('credential'),id=input.value.trim();if(!id){input.setCustomValidity('Enter a credential ID.');input.reportValidity();return}input.setCustomValidity('');document.getElementById('result').textContent=id==='DEMO-CREDENCE-001'?'Demo match found: sample credential only. No institution record or blockchain was checked.':'No sample record matches this ID. Real credential validity cannot be determined in this demo.'};document.getElementById('credential').oninput=e=>e.target.setCustomValidity('');
</script></body></html>
