/* Shadow-built surfaces: no contour strokes or outlines. */
.contours{width:360px;height:360px;top:39%;margin:-180px 0 0 -180px;isolation:isolate}
.soft-layer{position:absolute;left:50%;top:50%;width:var(--size);height:var(--size);margin-left:calc(var(--size) / -2);margin-top:calc(var(--size) / -2);border:0;outline:0;border-radius:50%;background:#152C40;opacity:0;transform:scale(.1);box-shadow:none;will-change:transform,opacity,box-shadow}
.soft-layer.outer{--size:330px;--lag:0s;z-index:1}.soft-layer.middle{--size:232px;--lag:.36s;z-index:2}.soft-layer.inner{--size:134px;--lag:.72s;z-index:3}
.cinematic.play .soft-layer{animation:soft-depth 4.8s var(--lag) cubic-bezier(.25,.8,.25,1) both}
.cinematic.play .identity{animation:soft-brand 1.5s 3.4s cubic-bezier(.22,1,.36,1) both}
.cinematic.play .copy{animation:soft-copy 1.1s 4.15s cubic-bezier(.22,1,.36,1) both}

/* Cream-first splash; navy reserved for readable content and actions. */
body{background:#F1EDE4}.phone,.scene{background:#FAF7EF;border-color:#DDD6C9}.starfield{background:radial-gradient(ellipse at bottom,#EEE7DA 0%,#FAF7EF 75%)}.starfield:after{background:radial-gradient(ellipse at 50% 48%,#FAF7EF99 0%,transparent 65%)}.star-track.small{opacity:.22}.star-track.medium{opacity:.25}.star-track.large{opacity:.3}.copy h1,.status{color:#152C40}.copy p{color:#526777}.foot{color:#526777}.accent{background:#D5CCBA}.home{background:#152C4055}.logo-wrap{background:#FAF7EF;border:0;box-shadow:none}.soft-layer{background:#FAF7EF}.cinematic.play .soft-layer{animation-name:cream-depth}
@keyframes cream-depth{0%,8%{opacity:0;transform:scale(.08);box-shadow:none}35%,55%{opacity:1;transform:scale(1);box-shadow:18px 18px 44px #DCD5C8,-18px -18px 44px #FFFFFF}75%{opacity:.6;transform:scale(1.2);box-shadow:24px 24px 60px #DCD5C8,-24px -24px 60px #FFFFFF}100%{opacity:0;transform:scale(1.65);box-shadow:32px 32px 80px #DCD5C800,-32px -32px 80px #FFFFFF00}}
.replay,.demo-controls button{background:#152C40;color:#FAF7EF;border-color:#152C40}.replay:hover,.demo-controls button:hover{background:#294A60}.demo-controls{background:#FAF7EF}.onboard,.destination{color:#152C40}@media(max-width:440px){body{background:#FAF7EF}}
.star-track.small{opacity:.35}.star-track.medium{opacity:.42}.star-track.large{opacity:.5}
/* Persistent particles are a shared screen layer; foreground content stays above them. */
.starfield{z-index:0}.scene{z-index:1;background:transparent}.onboard{background:transparent!important}.onboard:before{background-color:transparent;opacity:.58;animation-duration:7s}.onboard:after{opacity:.35;animation-duration:10s}.onboarding-now .star-track{animation-play-state:running}.phone>.starfield{background:#FAF7EF}.ob-top,.ob-main,.ob-bottom,.destination{z-index:2}.status,.home{z-index:6}
@media(prefers-reduced-motion:reduce){.star-track,.onboard:before,.onboard:after{animation:none!important}}

/* Use the uploaded monochrome shield and wordmark; blend its dark screenshot surface into cream. */
.logo-wrap{width:270px;height:230px;background:transparent;overflow:hidden;border-radius:0;position:relative}.logo-wrap img{width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.33);filter:grayscale(1) contrast(4) invert(1);mix-blend-mode:multiply;clip-path:inset(0 0 11% 0)}.identity{isolation:isolate}.accent{margin-top:12px}

/* Let the light image surface inherit the cream scene instead of becoming a card.
   Blend the whole identity layer: an isolated parent prevents image-only blending
   from reaching the scene and leaves an opaque white rectangle. */
.identity{isolation:auto;mix-blend-mode:multiply}
.logo-wrap{background:transparent;border:0;border-radius:0;box-shadow:none;overflow:visible}
.logo-wrap img{background:transparent;border:0;border-radius:0;box-shadow:none;mix-blend-mode:normal;opacity:.92}

/* Turn the raster's white surface into alpha, rather than blending a white card.
   After inversion, dark logo pixels become maroon ink and white pixels vanish. */
.identity{isolation:auto;mix-blend-mode:normal}
.logo-wrap{background:transparent;border:0;box-shadow:none}
.logo-wrap img{filter:grayscale(1) contrast(4) invert(1) url(#credence-transparent-ink);mix-blend-mode:normal;opacity:1}

/* Native transparent PNG: no screenshot recolouring, clipping or container surface. */
.logo-wrap{width:250px;height:250px;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible}.logo-wrap img{width:100%;height:100%;object-fit:contain;object-position:center;filter:none!important;mix-blend-mode:normal!important;transform:none!important;clip-path:none!important;border-radius:0;background:transparent!important;animation:none!important;transition:none!important}.play .identity,.cinematic.play .identity{animation:none!important;transform:none!important;filter:none!important;background:transparent!important}.identity{border:0;box-shadow:none}.accent{display:none}

/* Restore entrance motion independently of the transparent logo asset. */
.contours{display:block!important}.cinematic.play .soft-layer{animation:cream-depth 4.8s var(--lag) cubic-bezier(.25,.8,.25,1) both!important}.play .identity{animation:logo-enter .6s cubic-bezier(.22,1,.36,1) both!important;opacity:1!important}.cinematic.play .identity{animation:logo-enter 1.5s 3.4s cubic-bezier(.22,1,.36,1) both!important;transform:none!important}.logo-wrap,.logo-wrap img{background:transparent!important;border:0!important;box-shadow:none!important;filter:none!important}.cinematic.play .starfield{animation:background-enter 1.6s ease-out both}
@keyframes logo-enter{from{visibility:hidden;opacity:0;translate:0 12px;scale:.96}to{visibility:visible;opacity:1;translate:0 0;scale:1}}
@keyframes background-enter{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.play .identity,.cinematic.play .identity,.cinematic.play .soft-layer,.cinematic.play .starfield{animation:none!important;opacity:1;translate:none;scale:1}.contours{display:none!important}}

function paper(label){if(label==='QR VERIFICATION')return '<div class="qr-illustration"><div class="finder a"></div><div class="finder b"></div><div class="finder c"></div><div class="qr-pattern"></div><span>QR PREVIEW</span></div>';return '<div class="ob-paper"><b>'+label+'</b><i></i><i></i><i></i><em></em></div>';}
function showOnboarding(){phone.classList.add('onboarding-now');phone.dataset.view='onboarding';step=0;render();}
function render(){const p=pages[step];onboard.innerHTML='<div class="ob-top"><span class="ob-brand">CREDENCE</span><button type="button" id="skip">Skip</button></div><div class="ob-main ob-fade" aria-live="polite"><div class="ob-art" aria-hidden="true">'+paper(p.art==='qr'?'QR VERIFICATION':'CERTIFICATE')+(p.art==='qr'?'<span class="ob-bubble">Scan to view record</span>':'<span class="ob-bubble">'+(p.art==='receive'?'From your institution':'Share your achievements')+'</span>')+'</div><div class="eyebrow">'+p.label+'</div><h2>'+p.title+'</h2><p>'+p.body+'</p><div class="ob-note">'+p.note+'</div></div><div class="ob-bottom"><div class="ob-progress" aria-label="Step '+(step+1)+' of 3">'+pages.map((_,i)=>'<span class="'+(i===step?'active':'')+'"></span>').join('')+'</div><button class="ob-next" id="next" type="button">'+(step===2?'Get started':'Next')+' <span aria-hidden="true">→</span></button><button class="ob-back" id="back" type="button" '+(step===0?'disabled':'')+'>Back</button></div>';
onboard.querySelector('#skip').onclick=finish;onboard.querySelector('#next').onclick=()=>{if(step===2)finish();else{step++;render();}};onboard.querySelector('#back').onclick=()=>{if(step>0){step--;render();}};}
function finish(){remember();updateStatus();route();}
function present(markup,view){phone.classList.add('onboarding-now');phone.dataset.view=view;onboard.innerHTML=markup;}
function route(){const session=document.getElementById('demo-session').value;
if(session==='valid'){present('<div class="destination"><div class="eyebrow">STUDENT WORKSPACE</div><h2>Welcome back,<br>Sam.</h2><p>Your saved demo session was restored.</p><div class="destination-card"><strong>Your credentials</strong><p>Certificates and official transcripts issued to you will appear here.</p></div><button class="ob-next" id="sign-out" type="button">Sign out of demo</button><small>Dashboard preview · No live credentials loaded.</small></div>','dashboard');onboard.querySelector('#sign-out').onclick=()=>{document.getElementById('demo-session').value='none';route();};}
else{present('<div class="destination"><div class="eyebrow">WELCOME TO CREDENCE</div><h2>Your achievements.<br>Your next chapter.</h2><p>'+(session==='expired'?'Your session has expired. Sign in again to access your credentials.':'Receive, keep and share your academic credentials.')+'</p><button class="ob-next" id="sign-in" type="button">Sign in · demo</button><div class="route-feedback" aria-live="polite"></div><small>Landing / sign-in preview · Authentication is not connected.</small></div>','landing');onboard.querySelector('#sign-in').onclick=()=>{onboard.querySelector('.route-feedback').textContent='Use “Valid session (simulated)” below, then Cold launch to preview the dashboard.';};}}
function failure(){present('<div class="destination"><div class="eyebrow">STARTUP INTERRUPTED</div><h2>We couldn’t<br>start CREDENCE.</h2><p>Startup did not complete. Please try again.</p><button class="ob-next" id="retry" type="button">Retry</button><button class="ob-back" id="offline-demo" type="button">Clear simulated failure</button><small>Test mode: the failure checkbox keeps Retry failing until cleared.</small></div>','error');onboard.querySelector('#retry').onclick=()=>launch(false);onboard.querySelector('#offline-demo').onclick=()=>{document.getElementById('demo-fail').checked=false;launch();};}
function launch(preview=false){clearTimeout(timer);phone.classList.remove('play','onboarding-now');phone.dataset.view='startup';phone.classList.toggle('cinematic',preview);void phone.offsetWidth;phone.classList.add('play');timer=setTimeout(()=>{if(document.getElementById('demo-fail').checked){failure();return;}if(!completed())showOnboarding();else route();updateStatus();},preview?8000:850);}
document.getElementById('cold-launch').onclick=()=>launch(false);document.getElementById('replay').textContent='Replay soft splash';document.getElementById('replay').onclick=()=>launch(true);document.getElementById('preview-onboarding').onclick=()=>{clearTimeout(timer);showOnboarding();};document.getElementById('reset-onboarding').onclick=()=>{try{localStorage.removeItem(key);}catch(e){}memory=false;updateStatus();launch(true);};updateStatus();launch(true);
})();
</script></body></html>
