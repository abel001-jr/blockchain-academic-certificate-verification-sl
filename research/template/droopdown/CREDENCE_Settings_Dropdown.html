<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE | Settings dropdown</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:#F8F7F2;color:#08283F;font:14px/1.6 Arial,sans-serif}main{width:min(460px,100%)}h1{font-size:24px;line-height:1.3;margin:0 0 10px}p{color:#4A5A68;margin:0 0 24px}.field{display:grid;gap:8px;margin:22px 0}label{font-weight:600;font-size:13px}.select-wrap{position:relative}.select-wrap:after{content:'';position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;color:#780110}select{appearance:none;-webkit-appearance:none;width:100%;min-height:44px;padding:10px 42px 10px 12px;border:1px solid #E4E1D6;border-radius:8px;background:#F8F7F2;color:#08283F;font:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s}select:hover:not(:disabled){border-color:#78011066}select:focus-visible{outline:2px solid #780110;outline-offset:3px}select:disabled{opacity:.55;cursor:not-allowed}small{color:#4A5A68;font-size:12px}option,optgroup{color:#08283F;background:#F8F7F2}.compact select{font-size:12px;color:#780110;border-radius:9px}.dark{padding:24px;border-radius:18px;background:#08283F;color:#F8F7F2}.dark p,.dark small{color:#F8F7F2cc}.dark select{background:#08283F;color:#F8F7F2;border-color:#F8F7F266}.dark .select-wrap:after{color:#F8F7F2}.dark select:focus-visible{outline-color:#F8F7F2}.dark select:hover:not(:disabled){border-color:#F8F7F2}@media(prefers-reduced-motion:reduce){select{transition:none}}</style></head><body><main class=""><h1>Settings dropdown</h1><p>Cream field with a maroon focus outline, based on the certificate branding editor.</p><div class="field"><label for="programme">Programme</label><div class="select-wrap"><select id="programme" name="programme"  aria-describedby="programme-help"><option value="">Choose a programme</option><option value="computing">Computer Science</option><option value="business">Business Administration</option></select></div><small id="programme-help">Choose from your institution?s configured programmes.</small></div><div class="field"><label for="unavailable">Unavailable selection</label><div class="select-wrap"><select id="unavailable" name="unavailable" disabled aria-describedby="unavailable-help"><option value="">No programmes configured</option></select></div><small id="unavailable-help">Disabled state example.</small></div></main></body></html>
