<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE | Delete button</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8f7f2;color:#152c40;font:14px/1.5 Arial,sans-serif}main{text-align:center}.delete{position:relative;width:160px;height:48px;padding:0;display:flex;align-items:center;border:1px solid #631623;border-radius:8px;background:#84303e;color:#f8f7f2;cursor:pointer;overflow:hidden;font:600 15px Arial,sans-serif;transition:background .3s,transform .15s}.text{position:absolute;left:0;width:112px;text-align:center;transition:opacity .25s,transform .3s}.icon-panel{position:absolute;right:0;top:0;bottom:0;width:46px;background:#751c2a;display:grid;place-items:center;transition:width .35s cubic-bezier(.22,1,.36,1)}.bin{position:relative;width:25px;height:29px;display:block}.lid{position:absolute;left:1px;top:3px;width:23px;height:6px;transform-origin:100% 70%;transition:transform .25s .32s;z-index:3}.bottom{position:absolute;left:4px;top:11px;width:17px;height:19px;z-index:2}.paper{position:absolute;width:9px;height:10px;top:12px;left:8px;background:#f8f7f2;border-radius:1px;opacity:0;z-index:1;pointer-events:none}.delete:is(:hover,:focus-visible,.playing) .text{opacity:0;transform:translateX(-12px)}.delete:is(:hover,:focus-visible,.playing) .icon-panel{width:100%}.delete:is(:hover,:focus-visible,.playing) .lid{transform:translateY(-3px) rotate(42deg)}.delete:is(:hover,:focus-visible,.playing) .paper{animation:throw-paper 1.5s .58s infinite}.delete:focus-visible{outline:3px solid #152c40;outline-offset:5px}.delete:active{transform:scale(.97);background:#631623}@keyframes throw-paper{0%{transform:translate(-50px,-55px) rotate(-35deg);opacity:0}12%{opacity:1}42%{transform:translate(0,-7px) rotate(15deg);opacity:1}58%{transform:translate(0,8px) rotate(0);opacity:0}100%{transform:translate(0,8px);opacity:0}}.status{font-size:12px;margin-top:22px;color:#617180;max-width:320px;min-height:36px}@media(hover:none){.delete .lid{transition-delay:0s}}@media(prefers-reduced-motion:reduce){.delete,.text,.icon-panel,.lid{transition:none}.delete:is(:hover,:focus-visible,.playing) .paper{animation:none}.delete:active{transform:none}}

/* CREDENCE: navy resting state, cream content, maroon destructive interaction. */
.delete{background:#152c40;border-color:#152c40;color:#f8f7f2}
.icon-panel{background:#203b50;transition:width .35s cubic-bezier(.22,1,.36,1),background .3s}
.bottom{fill:#203b50;transition:fill .3s}
.delete:is(:hover,:focus-visible,.playing){border-color:#751c2a;background:#751c2a}
.delete:is(:hover,:focus-visible,.playing) .icon-panel{background:#751c2a}
.delete:is(:hover,:focus-visible,.playing) .bottom{fill:#751c2a}
.delete:active{background:#631623}
@media(prefers-reduced-motion:reduce){.icon-panel,.bottom{transition:none}}
</style></head><body><main><button class="delete" id="delete" type="button" aria-label="Delete"><span class="text">Delete</span><span class="icon-panel" aria-hidden="true"><span class="bin"><svg class="lid" viewBox="0 0 26 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 6h22M9 6V2h8v4"/></svg><span class="paper"></span><svg class="bottom" viewBox="0 0 20 24" fill="#751c2a" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1h16l-1 19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M7 5v12m6-12v12"/></svg></span></span></button><p class="status" id="status" role="status">Hover or focus to preview. Tap to replay on mobile. Nothing is deleted.</p></main><script>
const button=document.getElementById('delete');let timer;button.addEventListener('click',()=>{clearTimeout(timer);button.classList.remove('playing');void button.offsetWidth;button.classList.add('playing');document.getElementById('status').textContent='Animation preview only. Connect your existing delete handler when integrating.';timer=setTimeout(()=>button.classList.remove('playing'),2200)});
</script></body></html>
